(()=>{'use strict';const $=id=>document.getElementById(id),con=$('conversation');let phase=0,timers=[];const later=(fn,ms)=>timers.push(setTimeout(fn,ms));const scroll=()=>requestAnimationFrame(()=>{const last=con.lastElementChild;if(last)last.scrollIntoView({behavior:'smooth',block:'end'})});const add=html=>{const holder=document.createElement('div');holder.innerHTML=html.trim();const el=holder.firstElementChild;con.appendChild(el);scroll();return el};const message=(txt,user=false)=>{const div=document.createElement('div');div.className='message'+(user?' me':'');const av=document.createElement('div');av.className='avatar'+(user?' human':'');av.textContent=user?'👤':'✦';const wrap=document.createElement('div');wrap.className='wrap';const bubble=document.createElement('div');bubble.className='bubble';bubble.textContent=txt;const time=document.createElement('div');time.className='stamp';time.textContent=new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});wrap.append(bubble,time);if(user)div.append(wrap,av);else div.append(av,wrap);con.append(div);scroll();return div};const attach=(id,handler)=>$(id)?.addEventListener('click',handler);function reset(){timers.forEach(clearTimeout);timers=[];phase=0;con.replaceChildren();$('hero').classList.remove('hidden');add(`<div class="panel prompt"><div class="caption">質問を入力（デモ用に設定済み）</div><div class="pretend-input">LINEの通知が来ないので、通知を設定したい。</div><div class="actions"><button class="btn" id="begin">➤ この質問を送信する</button></div></div>`);attach('begin',begin);scroll()}function begin(){if(phase!==0)return;phase=1;$('hero').classList.add('hidden');con.replaceChildren();message('LINEの通知が来ないので、通知を設定したい。',true);later(()=>{message('LINEの通知が届かないのですね。まずはiPhone側とLINEアプリ側の通知設定を確認してみましょう。');add(`<div class="panel" id="first"><h3>🔔 LINE通知の設定方法</h3><ol class="checklist"><li>iPhoneの「設定」→「通知」→「LINE」を開く</li><li>「通知を許可」をオンにする</li><li>「サウンド」と必要な通知の表示をオンにする</li><li>LINEアプリの「ホーム」→「設定」→「通知」で通知がオンか確認する</li></ol><p style="margin-top:12px">※ 画面の表示はOSやLINEのバージョンによって異なります。</p><div class="actions"><button class="btn" id="still">通知設定を変更してみたけど、変化なしです。</button><button class="btn outline" id="firstok">通知が来るようになりました</button></div></div>`);attach('still',escalate);attach('firstok',()=>resolved(true));phase=2},650)}function escalate(){if(phase!==2)return;phase=3;$('first')?.querySelector('.actions')?.remove();message('通知設定を変更してみたけど、変化なしです。',true);later(()=>{message('設定を見直しても改善しないのですね。AIだけでは原因を特定しきれないため、人による検証ネットワークで確認します。少々お待ちください。');const p=add(`<div class="panel escalate" id="verify"><span class="label">◎ 検証ネットワーク</span><h3>人による検証中</h3><p>同様の状況を想定した実機検証を進めています。確認できた内容を評価し、安全性を確かめてからご案内します。</p><div class="status"><span class="spin" id="spinner"></span><span id="status">人による検証中...</span></div><div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="5" id="progress"><div class="fill" id="fill"></div></div><div class="percent"><span id="detail">検証ネットワークに依頼しています</span><strong id="pct">5%</strong></div><div class="stages"><div class="stage active" id="s0"><span>1</span>実機検証</div><div class="stage" id="s1"><span>2</span>結果を評価</div><div class="stage" id="s2"><span>3</span>安全性確認</div></div><p class="small" style="margin-top:14px">※ デモのため各ステップは自動で進みます。</p></div>`);phase=4;later(()=>step(38,'3人による実機検証を実施中（デモ）','人による検証中...',0),1100);later(()=>step(69,'検証結果を評価しています','検討結果を評価中...',1),3650);later(()=>step(91,'ご案内する手順の安全性を確認しています','安全性をチェック中...',2),6300);later(finish,9300)},550)}function step(value,detail,status,stage){if(phase!==4)return;$('fill').style.width=value+'%';$('pct').textContent=value+'%';$('progress').setAttribute('aria-valuenow',value);$('detail').textContent=detail;$('status').textContent=status;for(let i=0;i<3;i++){$('s'+i).className='stage '+(i<stage?'done':i===stage?'active':'');$('s'+i).querySelector('span').textContent=i<stage?'✓':String(i+1)}scroll()}function finish(){if(phase!==4)return;phase=5;$('fill').style.width='100%';$('pct').textContent='100%';$('progress').setAttribute('aria-valuenow','100');$('spinner').classList.remove('spin');$('spinner').textContent='✓';$('status').textContent='検証・評価・安全性チェック完了（デモ）';$('detail').textContent='すべての工程が完了しました';for(let i=0;i<3;i++){$('s'+i).className='stage done';$('s'+i).querySelector('span').textContent='✓'}later(()=>{message('検証が完了しました。3人の方に実機検証をした結果、以下のことで解決する可能性が高いです。');add(`<div class="panel complete"><div class="successhead"><div class="successicon">✓</div><div><h3>コミュニティ検証結果</h3><span class="tag">安全性チェック完了（デモ）</span></div></div><div class="verifycount"><span class="face">👤👤👤</span>3人の実機検証を再現したデモ結果</div><p>iPhone側の通知設定だけでなく、LINEアプリ内の通知設定とトーク個別の通知設定も合わせて確認してみてください。</p><ol class="checklist"><li>LINEの「ホーム」→「設定（歯車）」→「通知」を開き、通知をオンにする</li><li>通知が来ない相手のトークを開き、トーク単位の「通知オフ」設定になっていないか確認する</li><li>iPhoneの「設定」→「集中モード」でLINEの通知が制限されていないか確認する</li><li>LINEをいったん閉じて開き直し、別の端末からメッセージを送って通知を確認する</li></ol><p class="small" style="margin-top:12px">※ 実際に3人が検証した結果ではありません。機種・OS・アプリのバージョンによって手順が異なる場合があります。</p></div>`);add(`<div class="panel feedback" id="feedback"><h3>解決しましたか？</h3><p>案内した方法で通知が届くようになったか教えてください。</p><div class="actions"><button class="btn" id="yes">✓ はい、解決しました</button><button class="btn outline" id="no">まだ解決していません</button></div></div>`);attach('yes',()=>resolved(true));attach('no',()=>resolved(false))},750)}function resolved(ok){if(![2,5].includes(phase))return;phase=6;$('feedback')?.remove();if(ok&&$('first'))$('first').querySelector('.actions')?.remove();message(ok?'はい、解決しました！':'まだ解決していません。',true);later(()=>{message(ok?'解決できてよかったです！ ご報告ありがとうございます。peace496AIはこれからも、解決までサポートします。':'お知らせいただきありがとうございます。無理に同じ操作を繰り返す必要はありません。実際のサービスでは機種や状況を伺い、追加検証へ引き継ぎます。');add(`<div class="panel done-message"><h3>${ok?'✓ サポート完了':'↻ 追加サポートへ'}</h3><p>${ok?'お困りの際はいつでもご相談ください。':'このデモではここまでご体験いただけます。'}</p><div class="actions"><button class="btn muted" id="again">最初からもう一度試す</button></div></div>`);attach('again',reset)},560)}$('reset').addEventListener('click',reset);reset()})();
</script></body></html>
